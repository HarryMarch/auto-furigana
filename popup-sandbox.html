<html>

<head>
    <title></title>
    <script type="text/javascript" src="vue/vue.global.prod.js"></script>

    <script type="text/template" id="template">
        <div class="rows">
            <div class="container logo">
                <img src="icon.png" alt="" width="20" height="20">
                &nbsp;&nbsp;
                <span>Auto Furigana</span>
                <div style="flex: 1 1;"></div>
                <a href="https://ko-fi.com/x6udpngx" target="_blank" title="Support Me">
                    <img src="./ko-fi.png" alt="">
                </a>
            </div>

            <hr>

            <div class="container rows">
                <div class="form-item">
                    <div>Flashcards</div>
                </div>

                <div class="sep"></div>

                <div class="form-item">
                    <button @click="toggleFlashcards"
                            style="flex: 1; padding: 6px 12px; background: #9C27B0; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px;">
                        {{ showFlashcards ? 'Close' : 'Open' }} Flashcards
                    </button>
                </div>
            </div>

            <div v-if="showFlashcards" class="flashcard-section">
                <div class="sep"></div>
                
                <div class="form-item">
                    <label>Card Type:</label>
                    <select v-model="flashcardType" @change="loadFlashcards" style="flex: 1; padding: 4px;">
                        <option value="kanji">Kanji</option>
                        <option value="words">Words (Pitch Accent)</option>
                    </select>
                </div>

                <div class="sep"></div>

                <div v-if="flashcards.length > 0" class="flashcard-container">
                    <div class="flashcard" :class="{flipped: isFlipped}" @click="flipCard">
                        <div class="flashcard-inner">
                            <div class="flashcard-front">
                                <div class="flashcard-content">{{ currentCard.front }}</div>
                                <div class="flashcard-hint">Click to flip</div>
                            </div>
                            <div class="flashcard-back">
                                <div class="flashcard-content" v-html="currentCard.back"></div>
                            </div>
                        </div>
                    </div>

                    <div class="flashcard-controls">
                        <button @click.stop="previousCard" :disabled="currentCardIndex === 0"
                                style="padding: 6px 12px; background: #607D8B; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                            &larr; Previous
                        </button>
                        <span style="margin: 0 10px;">{{ currentCardIndex + 1 }} / {{ flashcards.length }}</span>
                        <button @click.stop="nextCard" :disabled="currentCardIndex === flashcards.length - 1"
                                style="padding: 6px 12px; background: #607D8B; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                            Next &rarr;
                        </button>
                    </div>

                    <div class="sep"></div>

                    <div class="form-item">
                        <button @click="shuffleCards"
                                style="flex: 1; padding: 6px 12px; background: #FF5722; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px;">
                            Shuffle Cards
                        </button>
                    </div>
                </div>

                <div v-else class="flashcard-empty">
                    <p>No {{ flashcardType }} available. Add some using the form above!</p>
                </div>

                <div class="sep"></div>
            </div>

            <hr>

            <div class="container rows">
                <div class="form-item">
                    <div>Add new word</div>
                </div>

                <div class="sep"></div>

                <div class="form-item">
                    <input type="text"
                           v-model="newWordInput"
                           placeholder="key;value"
                           @keyup.enter="addNewWord"
                           style="flex: 1; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; min-width: 0;">
                    <button @click="addNewWord"
                            style="margin-left: 8px; padding: 6px 12px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px;">
                        Add
                    </button>
                </div>
            </div>

            <div class="container rows">
                <div class="form-item">
                    <div>Add new kanji</div>
                </div>

                <div class="sep"></div>

                <div class="form-item">
                    <input type="text"
                           v-model="newKanjiInput"
                           placeholder="key;value"
                           @keyup.enter="addNewKanji"
                           style="flex: 1; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; min-width: 0;">
                    <button @click="addNewKanji"
                            style="margin-left: 8px; padding: 6px 12px; background: #FF9800; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px;">
                        Add
                    </button>
                </div>
            </div>

            <div class="container rows">
                <div class="form-item">
                    <div>Export additional cache</div>
                </div>

                <div class="sep"></div>

                <div class="form-item">
                    <button @click="exportAdditional"
                            style="flex: 1; padding: 6px 12px; background: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px;">
                        Export
                    </button>
                </div>
            </div>

            <hr>

            <div class="container rows">
                <div class="form-item">
                    <div>Enable on</div>
                </div>

                <div class="sep"></div>

                <div class="form-item">
                    <label>All new pages</label>
                    <div class="switch"
                         :class="{on: enableOnAllPage}"
                         @click="setEnableOnAllPage(!enableOnAllPage)"
                    ></div>
                </div>

                <div class="sep"></div>

                <div class="form-item">
                    <label>New pages of this site</label>
                    <div class="switch"
                         :class="{on: enableOnThisSite}"
                         @click="setEnableOnThisSite(!enableOnThisSite)"
                    ></div>
                </div>
                <div style="color: #999;">{{ siteDomain }}</div>

                <div class="sep"></div>

                <div class="form-item">
                    <label>Current page</label>
                    <div class="switch"
                         :class="{on: enableOnThisTab}"
                         @click="setEnableOnThisTab(!enableOnThisTab)"
                    ></div>
                </div>
            </div>

            <hr>

            <div class="container rows">
                <div class="form-item">
                    <label>Show Google translation on mouse hover</label>
                    <div class="switch"
                         :class="{on: showTranslationOnMouseHover}"
                         @click="setShowTranslationOnMouseHover(!showTranslationOnMouseHover)"
                    ></div>
                </div>

                <div class="sep"></div>

                <div class="form-item">
                    <label>Target language</label>
                    <select style="width: 100px;"
                            v-model="targetLanguage"
                    >
                        <option value="ar">Arabic</option>
                        <option value="pt-BR">Brazilian Portuguese</option>
                        <option value="zh-CN">Chinese (Simplified)</option>
                        <option value="zh-TW">Chinese (Traditional)</option>
                        <option value="cs">Czech</option>
                        <option value="nl">Dutch</option>
                        <option value="en-uk">English (UK)</option>
                        <option value="en">English (US)</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="hi">Hindi</option>
                        <option value="it">Italian</option>
                        <option value="ko">Korean</option>
                        <option value="ru">Russian</option>
                        <option value="sk">Slovak</option>
                        <option value="tr">Turkish</option>
                        <option value="es">Spanish</option>
                    </select>
                </div>
            </div>
        </div>
    </script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            font-size: 14px;
            color: #5f6368;
        }

        .container {
            padding: 8px 12px;
        }

        .rows {
            display: flex;
            flex-direction: column;
        }

        .cols {
            display: flex;
            flex-direction: row;
        }

        .logo {
            display: flex;
            align-items: center;
            font-size: 16px;
            font-weight: 500;
            color: #5a5a5a;
        }

        hr {
            width: 100%;
            height: 1px;
            border: none;
            background: #f0f0f0;
            margin: 0;
        }

        .sep {
            margin-bottom: .5em;
        }

        .form-item {
            display: flex;
            align-items: center;
        }

        .form-item label {
            flex: 1 1;
            min-width: 0;
            font-weight: 500;
            padding-right: 1em;
        }

        .switch {
            position: relative;
            box-sizing: border-box;
            width: 40px;
            height: 20px;
            border-radius: 10px;
            background: #bdc1c6;
            cursor: pointer;
            transition: all .3s;
        }

        .switch.disabled {
            background: #dbdde3 !important;
            cursor: default !important;
        }

        .switch:before {
            content: '';
            display: block;
            position: absolute;
            left: 4px;
            top: 4px;
            width: 12px;
            height: 12px;
            border-radius: 6px;
            background: #fff;
            transition: all .3s;
        }

        .switch.on {
            background: #1a73e8;
        }

        .switch.on:before {
            left: 24px;
        }

        select {
            height: 24px;
            line-height: 24px;
            border: none;
            border-radius: 4px;
            background: #f1f3f4;
            outline: none;
        }

        a {
            text-decoration: none;
            font-size: inherit;
            color: #1890ff;
        }

        .flashcard-section {
            padding: 0 12px;
        }

        .flashcard-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .flashcard {
            width: 100%;
            height: 200px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flashcard-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }

        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .flashcard-front,
        .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            box-sizing: border-box;
        }

        .flashcard-front {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .flashcard-back {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            transform: rotateY(180deg);
        }

        .flashcard-content {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            word-wrap: break-word;
            overflow-y: auto;
            max-height: 100%;
        }

        .flashcard-back .flashcard-content {
            font-size: 14px;
            line-height: 1.4;
            font-weight: normal;
        }

        .flashcard-hint {
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.8;
        }

        .flashcard-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .flashcard-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .flashcard-empty {
            text-align: center;
            padding: 20px;
            color: #999;
        }
    </style>
</head>

<body tabindex="0">
    <div id="app"></div>
    <script type="text/javascript" src="popup-sandbox.js"></script>
</body>

</html>
